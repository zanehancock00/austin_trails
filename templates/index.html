<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Austin Trails - Strava Segment Explorer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Austin Trails Explorer</h1>
            <p class="subtitle">Discover high-elevation segments near Cedar Park, TX</p>
        </header>

        <nav class="page-nav">
            <a href="/" class="active">Segment Explorer</a>
            <a href="/elevation-routes">Elevation Training</a>
        </nav>

        <div class="filters-container">
            <h2>Filters</h2>

            <div class="filter-group" style="margin-bottom: 1rem;">
                <label for="dataSource">Data Source</label>
                <select id="dataSource">
                    <option value="segments">Public Segments</option>
                    <option value="routes">My Personal Routes</option>
                    <option value="both">Both Segments & Routes</option>
                </select>
            </div>

            <div class="filter-grid">
                <div class="filter-group">
                    <label for="minElevation">Min Elevation (ft)</label>
                    <input type="number" id="minElevation" value="0" min="0" step="50">
                </div>

                <div class="filter-group">
                    <label for="maxElevation">Max Elevation (ft)</label>
                    <input type="number" id="maxElevation" value="5000" min="0" step="50">
                </div>

                <div class="filter-group">
                    <label for="minDistance">Min Distance (mi)</label>
                    <input type="number" id="minDistance" value="0" min="0" step="0.5">
                </div>

                <div class="filter-group">
                    <label for="maxDistance">Max Distance (mi)</label>
                    <input type="number" id="maxDistance" value="50" min="0" step="0.5">
                </div>

                <div class="filter-group">
                    <label for="maxDistanceFromCedar">Max Distance from Cedar Park (mi)</label>
                    <input type="number" id="maxDistanceFromCedar" value="50" min="0" step="5">
                </div>

                <div class="filter-group">
                    <label for="sortBy">Sort By</label>
                    <select id="sortBy">
                        <option value="elevation_desc">Elevation Gain (High to Low)</option>
                        <option value="elevation_asc">Elevation Gain (Low to High)</option>
                        <option value="distance_desc">Distance (Long to Short)</option>
                        <option value="distance_asc">Distance (Short to Long)</option>
                        <option value="elevation_per_km">Intensity (ft/mi)</option>
                        <option value="grade">Average Grade</option>
                        <option value="distance_from_cedar">Distance from Cedar Park</option>
                    </select>
                </div>
            </div>

            <div class="filter-actions">
                <button id="applyFilters" class="btn btn-primary">Apply Filters</button>
                <button id="resetFilters" class="btn btn-secondary">Reset</button>
                <button id="refreshData" class="btn btn-secondary">Refresh from Strava</button>
            </div>
        </div>

        <div class="results-header">
            <h2>Results</h2>
            <div id="resultsCount" class="results-count">Loading...</div>
        </div>

        <div id="loading" class="loading">Loading segments...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="segmentsList" class="segments-list"></div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
