<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Austin Trails - Strava Segment Explorer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>🚴 Austin Trails Explorer</h1>
            <p class="subtitle">Discover high-elevation segments near Cedar Park, TX</p>
        </header>

        <div class="filters-container">
            <h2>Filters</h2>

            <div class="filter-grid">
                <div class="filter-group">
                    <label for="minElevation">Min Elevation (m)</label>
                    <input type="number" id="minElevation" value="30" min="0" step="10">
                </div>

                <div class="filter-group">
                    <label for="maxElevation">Max Elevation (m)</label>
                    <input type="number" id="maxElevation" value="300" min="0" step="10">
                </div>

                <div class="filter-group">
                    <label for="minDistance">Min Distance (km)</label>
                    <input type="number" id="minDistance" value="0" min="0" step="0.5">
                </div>

                <div class="filter-group">
                    <label for="maxDistance">Max Distance (km)</label>
                    <input type="number" id="maxDistance" value="15" min="0" step="0.5">
                </div>

                <div class="filter-group">
                    <label for="maxDistanceFromCedar">Max Distance from Cedar Park (km)</label>
                    <input type="number" id="maxDistanceFromCedar" value="30" min="0" step="5">
                </div>

                <div class="filter-group">
                    <label for="sortBy">Sort By</label>
                    <select id="sortBy">
                        <option value="elevation">Elevation Gain (High to Low)</option>
                        <option value="distance">Distance (Long to Short)</option>
                        <option value="elevation_per_km">Intensity (m/km)</option>
                        <option value="grade">Average Grade</option>
                        <option value="distance_from_cedar">Distance from Cedar Park</option>
                    </select>
                </div>
            </div>

            <div class="filter-actions">
                <button id="applyFilters" class="btn btn-primary">Apply Filters</button>
                <button id="resetFilters" class="btn btn-secondary">Reset</button>
                <button id="refreshData" class="btn btn-secondary">Refresh from Strava</button>
            </div>
        </div>

        <div class="results-header">
            <h2>Results</h2>
            <div id="resultsCount" class="results-count">Loading...</div>
        </div>

        <div id="loading" class="loading">Loading segments...</div>
        <div id="error" class="error" style="display: none;"></div>

        <div id="segmentsList" class="segments-list"></div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
